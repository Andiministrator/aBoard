# Builds the server image for linux/amd64 and linux/arm64 and pushes it to the
# GitHub Container Registry when a release is published (or by hand).
# arm64 is cross-compiled in server/Dockerfile, so no emulation is needed.
# Only first-party code runs here: actions/checkout (pinned to a commit) and
# the docker/buildx already installed on the runner.
name: Server image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v1.66.0-140)"
        required: true

# One queue per tag: a shared group keeps only one waiting run and would silently
# drop the middle one of three quick releases.
concurrency:
  group: server-image-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
          # all tags, to find the highest one for :latest
          fetch-depth: 0
          fetch-tags: true

      - name: Build and push
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          EVENT: ${{ github.event_name }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.]+)*$ ]]; then
            echo "Not a release tag: $RELEASE_TAG" >&2; exit 1
          fi
          # The commit actually checked out (for workflow_dispatch GITHUB_SHA is the branch head)
          sha="$(git rev-parse HEAD)"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/aboard"
          tags=(--tag "${image}:${RELEASE_TAG}")
          # :latest only for a regular (non-pre-)release that is also the highest
          # release tag; a release published later for an older line keeps :latest.
          # only plain release tags (vX.Y.Z or vX.Y.Z-N); sort -V would rank vX.Y.Z-rc1 above vX.Y.Z-145
          highest="$(git tag -l 'v[0-9]*' | grep -E '^v[0-9]+(\.[0-9]+)*(-[0-9]+)?$' | sort -V | tail -n 1 || true)"
          if [ "$EVENT" = "release" ] && [ "$PRERELEASE" != "true" ] && [ "$RELEASE_TAG" = "$highest" ]; then
            tags+=(--tag "${image}:latest")
          else
            echo "No :latest (event=$EVENT, prerelease=$PRERELEASE, highest tag=$highest)"
          fi
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --name aboard --use
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            -f server/Dockerfile \
            --build-arg VERSION="$RELEASE_TAG" \
            --build-arg COMMIT="${sha::7}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${sha}" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            "${tags[@]}" \
            --push .
          docker buildx imagetools inspect "${image}:${RELEASE_TAG}"
